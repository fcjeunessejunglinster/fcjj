<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FCJJ</title>
<meta name="description" content="Spiele, Ergebnisse und Tabellen der Mannschaften des FC Jeunesse Junglinster, automatisch von der FLF.">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="app.webmanifest">
<style>
:root{
  --bg:#f4f4f2; --karte:#fff; --text:#111; --leise:#666660; --linie:#e2e2de;
  --schwarz:#111; --rot:#e31b23; --rotHell:#fde8e9; --grau:#bfbfbd;
  --sieg:#1f7a3f; --remis:#8a7a2a; --nl:#b3261e;
  --kopf:#111; --kopfText:#fff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121212; --karte:#1c1c1c; --text:#eee; --leise:#a2a29c; --linie:#2e2e2e;
  --schwarz:#eee; --rotHell:#3a1416; --sieg:#4cb873; --remis:#cdb85a; --nl:#ef6b62;
  --kopf:#000; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.innen{max-width:760px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
header{background:var(--kopf);color:var(--kopfText);padding-top:env(safe-area-inset-top,0px);border-bottom:4px solid var(--rot)}
header .innen{display:flex;align-items:center;gap:12px;padding-block:12px}
header img{width:48px;height:48px;border-radius:12px;background:#fff;flex:none}
header h1{margin:0;font-size:19px;line-height:1.1;letter-spacing:.01em}
header p{margin:3px 0 0;font-size:13px;opacity:.75}
#reiter{background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--linie)}
.raster{display:grid;grid-template-columns:repeat(60,1fr);gap:6px}
.raster button{position:relative;font-family:inherit;font-weight:600;font-size:14px;line-height:1.15;padding:10px 4px;border-radius:9px;border:1px solid var(--linie);
  background:var(--karte);color:var(--text);cursor:pointer;min-width:0;overflow-wrap:anywhere}
.raster button.woche{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:8px}
.raster button.nati{padding:5px 4px}
.raster button.nati[aria-pressed="true"]{background:var(--karte);color:var(--text);border:2px solid var(--schwarz)}
.raster button.woche small{font-weight:500;color:var(--leise)}
.raster button[aria-pressed="true"]{background:var(--schwarz);color:var(--bg);border-color:var(--schwarz)}
.raster button[aria-pressed="true"] small{color:inherit;opacity:.8}
.raster button:focus-visible{outline:3px solid var(--rot);outline-offset:1px}
main .innen{padding-block:14px 30px;display:grid;gap:14px}
.karte{background:var(--karte);border:1px solid var(--linie);border-radius:12px;overflow:hidden}
.karte>h2,.karte>summary{margin:0;padding:10px 14px;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--leise);
  border-bottom:1px solid var(--linie);font-weight:700}
details.karte>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;border-bottom:0}
details.karte>summary::after{white-space:nowrap;flex:none;margin-left:10px;content:"Anzeigen ▾";text-transform:none;letter-spacing:0;font-weight:600;color:var(--text)}
details.karte[open]>summary{border-bottom:1px solid var(--linie)}
details.karte[open]>summary::after{content:"Zuklappen ▴"}
html[lang="en"] details.karte>summary::after{content:"Show ▾"}
html[lang="en"] details.karte[open]>summary::after{content:"Hide ▴"}
html[lang="fr"] details.karte>summary::after{content:"Afficher ▾"}
html[lang="fr"] details.karte[open]>summary::after{content:"Masquer ▴"}
.sprache{margin-left:auto;display:flex;gap:4px;flex:none}
.sprache button{font:inherit;font-size:13px;font-weight:700;padding:5px 8px;border-radius:7px;border:1px solid rgba(255,255,255,.35);
  background:transparent;color:#fff;cursor:pointer}
.sprache button[aria-pressed="true"]{background:#fff;color:#111;border-color:#fff}
header .innen>div:nth-child(2){min-width:0}
.heute{border:2px solid var(--rot)}
.heute>h2{background:var(--rot);color:#fff;border-bottom:0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.heute>h2 .schild{background:#fff;color:var(--rot);margin:0}
.kasten{padding:12px 14px 14px;display:grid;gap:8px;text-align:center}
.kasten .wann{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.kasten .wann.klein{font-size:14px;font-weight:600;color:var(--leise)}
.kasten ul.spiele li{padding:4px 0;border:0}
.kasten .zusatz{font-size:14px;color:var(--leise)}
.kasten .zusatz b{color:var(--text)}
.fupa{border:2px solid var(--rot)}
.fupa .fupatext{padding:12px 14px 0;font-size:14px;color:var(--leise)}
.fupa .fupatext a{color:var(--text)}
.fupa .knopf{margin:12px 14px 4px}
.fupa .klein{padding:4px 14px 12px;font-size:12px;color:var(--leise)}
.fupa .klein a{color:var(--leise)}
.fupaplatz{padding:6px 8px;min-height:60px}
.fupaplatz .match-header-caption.live,.fupaplatz .fp-caption-text.live{border:0!important;box-shadow:none!important}
.linkknopf{background:none;border:0;padding:6px 0;font:inherit;font-size:13px;color:var(--leise);text-decoration:underline;cursor:pointer}
ul.spiele li.event{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;background:var(--rotHell)}
li.event .evt{font-weight:800;font-size:17px;color:var(--rot)}
li.event .evf{font-size:13px;font-weight:700;color:var(--leise);letter-spacing:.03em}
li.event .evd{font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}
.events{border:2px solid var(--rot)}
.raster button.blknopf{padding:5px 4px;position:relative}
.raster button.blknopf[aria-pressed="true"]{background:var(--karte);color:var(--text);border:2px solid var(--schwarz)}
.tagpunkt{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--rot);box-shadow:0 0 0 2px var(--karte)}
.raster button[aria-pressed="true"] .tagpunkt{box-shadow:0 0 0 2px var(--schwarz)}
.raster button.nati[aria-pressed="true"] .tagpunkt{box-shadow:0 0 0 2px var(--karte)}
.blknopf .livepunkt{color:var(--rot);font-size:14px;position:absolute;top:4px;right:8px}
li.sp .mitte.live{background:var(--rot);border-color:var(--rot);color:#fff}
li.sp .tore{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:0 16px;font-size:12px;color:var(--leise)}
li.sp .tore .h{text-align:right}
.livezeile{color:var(--rot);font-weight:700}
.sponsor{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;background:#fff;border:1px solid var(--linie);border-radius:12px}
.sponsor span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6a6a66}
.sponsor img{width:100%;max-width:260px;height:auto;display:block}
.wetter{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;font-size:15px;font-variant-numeric:tabular-nums}
.wetter b{font-size:18px}
.wetter .leise{font-size:13px}
.warnung{border:2px solid #f2c200}
.warnung.w-orange{border-color:#f28c00}
.warnung.w-red{border-color:#e30613}
.warnung ul{list-style:none;margin:0;padding:0 14px 6px}
.warnung li{padding:8px 0;border-top:1px solid var(--linie);display:grid;gap:4px}
.warnung li:first-child{border-top:0}
.warnung .klein{padding:0 14px 12px}
.warnspiel{text-align:center;font-weight:600;font-size:14px;padding:6px 10px;margin:6px auto 0;border-radius:10px;background:#fff6cc;color:#5c4a00;width:fit-content}
.warnspiel.w-orange{background:#ffe3c2;color:#6b3600}
.warnspiel.w-red{background:#ffd6d9;color:#7a0010}
.ferienzeile{padding-block:0 10px;font-weight:600}
.blkader{border-top:1px solid var(--linie)}
.blkader summary{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;font-weight:600}
.blkader summary img{width:28px;height:28px;object-fit:contain}
.blkader summary .leise{margin-left:auto;font-weight:400}
.kaderliste{list-style:none;margin:0;padding:0 14px 6px}
.kaderliste li{padding:0}
.spielfeld{display:block;width:100%;height:auto}
tr.wir td{font-weight:700;background:rgba(227,6,19,.08)}
.profil summary{display:grid;grid-template-columns:40px 28px 1fr auto;align-items:center;gap:8px;padding:5px 0;cursor:pointer;list-style:none}
.profil summary::-webkit-details-marker{display:none}
.profilinhalt{display:grid;gap:4px;padding:4px 0 12px 48px;font-size:15px}
.profilinhalt .tag{margin:8px 0 2px;padding:0;background:none}
.profilinhalt .verl{color:#e30613}
.werte{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin:0}
.werte div{background:var(--linie);border-radius:10px;padding:6px 8px;text-align:center}
.werte dt{font-size:12px;opacity:.75}
.werte dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.kaderliste img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--linie)}
.kaderliste .nr{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.naechst + .wetter{padding:4px 14px 0}
.route{color:var(--rot);font-weight:700;text-decoration:none;white-space:nowrap}
.route:hover{text-decoration:underline}
.kasten .routeknopf{justify-self:center;font-size:16px;padding:10px 18px}
.fupalink{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;text-decoration:none;color:var(--text);font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase}
.fupalink .leise{text-transform:none;letter-spacing:0;font-weight:600}
.fupalink:hover{border-color:var(--schwarz)}
ul.spiele.linkliste li{display:block;padding:0}
.hinweisbeitrag{border:2px solid var(--rot)}
.betraege{padding:0 14px 12px}
.betraege .leise{font-size:13px}
.betraege table{margin-top:4px;font-size:15px}
.betraege td{padding:4px 0;text-align:left}
.betraege td:first-child{font-weight:800;white-space:nowrap;padding-right:14px;text-align:right;font-variant-numeric:tabular-nums}
.iban{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:0 14px 14px}
.iban .leise{font-size:13px;width:100%}
.iban code{font-size:18px;font-weight:700;letter-spacing:.03em;font-variant-numeric:tabular-nums;user-select:all}
.iban .knopf{padding:8px 14px;font-size:14px}
.hinweisbeitrag p.ausschluss{padding-top:0;font-weight:700;color:var(--rot)}
.hinweisbeitrag p{margin:0;padding:12px 14px;line-height:1.5}
.linkliste a{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px;text-decoration:none;color:var(--text)}
.linkliste .lk{font-size:24px}
.linkliste .lt{display:grid;gap:2px;min-width:0}
.linkliste .lt span{font-size:14px;color:var(--leise)}
.linkliste .lp{font-size:22px;color:var(--leise)}
.kasten .kabine{font-size:16px;font-weight:700}
.kasten .satz{font-size:16px;font-weight:700}
.rocks{font-size:24px;font-weight:900;letter-spacing:.02em;color:var(--rot);font-style:italic}
li.sp .mitte.gross{font-size:30px;padding:4px 12px;min-width:84px}
.naechst{padding:12px 14px 0;text-align:center;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.naechst span{font-size:14px;font-weight:600;color:var(--leise)}
ul.spiele li.erstes{border-top:0;padding-top:6px}
.kal{border-top:1px solid var(--linie)}
.gross{padding:14px;display:grid;gap:6px}
.gross .zeit{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.gross .gegen{font-size:18px;font-weight:700}
.leise{color:var(--leise);font-size:14px}
ul.spiele{list-style:none;margin:0;padding:0}
ul.spiele li{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--linie)}
ul.spiele li:first-child{border-top:0}
ul.spiele li.klick{cursor:pointer}
/* Spielzeile: Heim rechtsbündig | Ergebnis/Uhrzeit | Gast, darunter Datum und Klasse */
ul.spiele li.sp{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:4px 10px;align-items:center}
li.sp .tm{font-size:15px;line-height:1.2;overflow-wrap:anywhere}
li.sp .tm.h{text-align:right}
li.sp .tm.wir{font-weight:800}
li.sp .mitte{min-width:64px;text-align:center;font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap;
  border-radius:8px;padding:3px 8px;background:var(--bg);border:1px solid var(--linie)}
li.sp .mitte.S{background:var(--sieg);border-color:var(--sieg);color:#fff}
li.sp .mitte.U{background:var(--grau);border-color:var(--grau);color:#111}
li.sp .mitte.N{background:var(--schwarz);border-color:var(--schwarz);color:var(--bg)}
li.sp .mitte.zeit{font-size:16px}
li.sp .mitte.leise{font-size:13px;font-weight:700;color:var(--leise)}
li.sp .unten{grid-column:1/-1;text-align:center;font-size:13px;color:var(--leise);overflow-wrap:anywhere}
li.sp .unten b{color:var(--text);font-weight:600}
.datum{font-size:13px;line-height:1.25;color:var(--leise);font-variant-numeric:tabular-nums}
.datum b{color:var(--text);font-size:14px}
.zeile{min-width:0}
.zeile .t{font-weight:600;overflow-wrap:anywhere}
.zeile .m{font-size:13px;color:var(--leise);overflow-wrap:anywhere}
.schild{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:5px;
  background:var(--rotHell);color:var(--rot);margin-right:6px;vertical-align:1px}
.schild.team{background:var(--schwarz);color:var(--bg)}
.erg{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;padding:2px 8px;border-left:4px solid var(--linie);white-space:nowrap}
.erg.S{border-color:var(--sieg)}.erg.U{border-color:var(--remis)}.erg.N{border-color:var(--nl)}
.erg.klein{font-size:13px;font-weight:600;color:var(--leise)}
.uhr{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabrahmen{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 6px;text-align:center}
th{font-size:12px;color:var(--leise);font-weight:600}
td:nth-child(2),th:nth-child(2){text-align:left}
tbody tr+tr td{border-top:1px solid var(--linie)}
tr.wir td{background:var(--rotHell);font-weight:700}
tr.wir td:first-child{box-shadow:inset 4px 0 var(--rot)}
.tag{padding:8px 14px;font-weight:700;font-size:14px;background:var(--bg);border-top:1px solid var(--linie)}
.knopf{display:inline-block;font-family:inherit;font-weight:600;font-size:15px;text-decoration:none;color:#fff;background:var(--schwarz);
  border:0;border-radius:10px;padding:11px 14px;cursor:pointer}
@media (prefers-color-scheme:dark){.knopf{color:#111}}
.kal{padding:14px;display:grid;gap:8px}
.cdj{padding:14px;display:grid;gap:8px;text-align:center}
.kal code{font-size:12px;overflow-wrap:anywhere;color:var(--leise)}
.hinweis{padding:14px;color:var(--leise)}
footer{text-align:center;font-size:13px;color:var(--leise);padding:0 14px 30px}
#chat{width:min(560px,100vw);height:min(720px,100dvh);max-height:100dvh;max-width:100vw;margin:auto;padding:0;border:0;border-radius:14px;background:var(--bg);color:var(--text);display:none;flex-direction:column}
#chat[open]{display:flex}
#chat::backdrop{background:rgba(0,0,0,.45)}
@media (max-width:600px){#chat{border-radius:0;height:100dvh;width:100vw}}
.chatkopf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;flex:none;background:var(--karte);border-bottom:1px solid var(--linie)}
#chatVerlauf{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:9px 12px;border-radius:14px;line-height:1.45;white-space:normal;overflow-wrap:anywhere}
.msg.ich{align-self:flex-end;background:var(--rot);color:#fff;border-bottom-right-radius:4px}
.msg.ki{align-self:flex-start;background:var(--karte);border:1px solid var(--linie);border-bottom-left-radius:4px}
.msg.ki a{color:inherit}
.chathinweis{margin:0;padding:6px 14px;font-size:12px}
#chatForm{flex:none;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--karte);border-top:1px solid var(--linie)}
#chatFrage{flex:1;resize:none;font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--linie);background:var(--bg);color:var(--text)}
.teilen{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 14px 22px}
.teilen .knopf{font-size:16px;padding:12px 22px}
.unten-knoepfe{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
#shop{background:var(--rot);color:#fff}
.hilfe{margin:0 auto 18px;max-width:732px}
#hilfe{width:calc(100% - 2 * max(14px, env(safe-area-inset-left, 0px)))}
.hilfe .anleitung{padding:4px 14px 14px}
.hilfe h3{margin:14px 0 6px;font-size:16px}
.hilfe ol{margin:0;padding-left:22px;display:grid;gap:6px}
.hilfe .tipp{margin:10px 0 0;font-size:14px;color:var(--leise)}
.hilfe .schon{padding:14px;color:var(--sieg);font-weight:700}
.teilen .ok{font-size:13px;color:var(--leise);min-height:1.2em}
@media (min-width:600px){.raster button{font-size:15px}}
</style>
</head>
<body>
<header><div class="innen">
  <img src="bilder/ball.png" alt="">
  <div><h1>FC Jeunesse Junglinster</h1><p id="unterzeile"></p></div>
  <div class="sprache" role="group" aria-label="Sprache / Language"><button data-lang="de">DE</button><button data-lang="fr">FR</button><button data-lang="en">EN</button></div>
</div></header>
<nav id="reiter"><div class="innen raster" id="knoepfe"></div></nav>
<main><div class="innen" id="inhalt"><p class="hinweis">Lade …</p></div></main>
<div class="teilen"><div class="unten-knoepfe"><a class="knopf" id="shop" href="https://form.jotform.com/242614644810352" target="_blank" rel="noopener"></a><button class="knopf" id="teilen" type="button"></button><button class="knopf" id="chatAuf" type="button" hidden></button></div><span class="ok" id="teilenOk" aria-live="polite"></span></div>
<dialog id="chat" aria-labelledby="chatTitel"><div class="chatkopf"><b id="chatTitel"></b><button type="button" class="knopf" id="chatZu"></button></div>
<div id="chatVerlauf" aria-live="polite"></div><p class="leise chathinweis" id="chatHinweis"></p>
<form id="chatForm"><textarea id="chatFrage" rows="2" maxlength="500"></textarea><button class="knopf" id="chatSenden" type="submit"></button></form></dialog>
<details class="karte hilfe innen" id="hilfe"><summary id="hilfeTitel"></summary><div id="hilfeText"></div></details>
<footer id="fuss"></footer>

<script>
"use strict";
const FASSUNG = "2026-11-11 z11";
const TZ = "Europe/Luxembourg";
const KEINE_ERG = ["U7", "U9", "U11", "WU11"];
const MERK = "fcjj_v1_";
const merk = {
  get: k => { try { return localStorage.getItem(MERK + k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(MERK + k, v); } catch (e) {} },
};
// ---- Sprache (Deutsch / English) ----
const TEXTE = {
  de: { cup: "Pokal", friendly: "Freundschaft", abgebr: "abgebr.", gespielt: "gespielt", offen: "offen", spieltag: "Spieltag",
    forfait: "Forfait", laeuft: "Spiel läuft", heute: "Heute Spieltag! ⚽", morgen: "Morgen Spieltag! ⚽", zeitOffen: "Uhrzeit offen",

  z.push("SPORTLICHE FRAGEN (vom Verein, 11.11.2026, hat Vorrang vor der Kontaktregel): Für alle sportlichen Fragen (Training, Einteilung in Mannschaften/Kategorien, Spielzeit, Positionen, Entwicklung, Probetraining) bitte an den Trainer oder an directeursportif@fcjj.lu wenden.");

  z.push("App: Daten der FLF (Spiele, Ergebnisse, Tabellen), Uhrzeit „offen“ = Anstoß noch nicht festgelegt. Kabinen gelten bei Heimspielen in Junglinster (Zahl = Kabinennummer).");
  for (const t of D?.teams || []) {
    const sp = eigeneSpiele(t), k = KABINEN[t.reiter];
    const kommend = sp.filter(x => !vorbei(x, now) && new Date(x.d) - now < 21 * 864e5).slice(0, 4);
    const letzte = sp.filter(x => vorbei(x, now) && now - new Date(x.d) < 30 * 864e5).slice(-3);
    const zeile = x => `${datum(new Date(x.d))} ${offen(x) ? "Uhrzeit offen" : uhr(new Date(x.d))} ${x.heim ? "Heim" : "Auswärts"}: ${x.h.n} – ${x.a.n}`
      + (x.erg && x.hs != null && (x.gespielt || x.forfait) ? ` ${x.hs}:${x.as}` : "") + (x.ort ? ` · Ort: ${x.ort}${platzAdresse(x.ort) ? " (" + platzAdresse(x.ort) + ")" : ""}` : "") + ` · ${x.klasse}`;
    const tb = Object.values(D.klassen).filter(kl => t.klassen?.includes(kl.id) && kl.tabelle?.length).map(kl => {
      const r = kl.tabelle.find(r => t.ids.includes(r.id)); return r ? `${kl.n}: Platz ${r.pl} von ${kl.tabelle.length}, ${r.pkt} Punkte (${r.s}S ${r.u}U ${r.nl}N, Tore ${r.t}:${r.g})` : "";
    }).filter(Boolean);
    z.push(`\n## ${t.reiter} (${t.alter || t.kat}, FLF-Name ${t.n})` + (k ? ` · Kabinen bei Heimspielen: FCJJ ${k[0]}, Gäste ${k[1]}` : "")
      + (REGELN[t.kat] ? ` · Spielregeln ${REGELN_KAT[t.kat]}: ${new URL(REGELN[t.kat], location.href).href}` : "")
      + (SPIELFELD[t.kat] ? ` · Spielfeld-Skizze ${SPIELFELD[t.kat].n}: in der App unter „Spielfeld“` : "")
      + `\nNächste Spiele: ${kommend.length ? "\n- " + kommend.map(zeile).join("\n- ") : "keine in den nächsten 3 Wochen"}`
      + (letzte.length ? `\nLetzte Spiele:\n- ${letzte.map(zeile).join("\n- ")}` : "") + (tb.length ? `\nTabelle: ${tb.join("; ")}` : ""));
  }
  const ev = kommendeEvents(now).slice(0, 12).map(e => `- ${sprachText(e.t)} (${eventDatum(e)})${e.fuer ? " für " + e.fuer : ""}${e.zusatz ? " – " + (typeof e.zusatz === "string" ? e.zusatz : e.zusatz.de) : ""}${e.chat ? " – " + e.chat : ""}`);
  if (ev.length) z.push("\n## Termine (Vereinsevents, LALUX Indoor Cup, Schulferien)\n" + ev.join("\n"));
  z.push("\n## Allgemeines Wissen\n" + CHAT_WISSEN.map(t => "- " + t).join("\n"));
  z.push("\n## Weitere Termine (nur für den Chat, vom Verein)\n" + CHAT_TERMINE.filter(([bis]) => bis >= tagKey(now)).map(([, t]) => "- " + t).join("\n"));
  const ft = FERIEN.feier.filter(f => f.tag >= tagKey(now)).slice(0, 4).map(f => `${f.tag} ${f.t}`);
  if (ft.length) z.push("Feiertage: " + ft.join(", "));
  const n = (D?.nati?.spiele || []).filter(x => !vorbei(x, now)).slice(0, 3).map(x => `${datum(new Date(x.d))} ${uhr(new Date(x.d))} ${x.h.n} – ${x.a.n}${x.ort ? " · " + x.ort : ""}`);
  if (n.length) z.push("\n## Nationalmannschaft Luxemburg, nächste Spiele\n- " + n.join("\n- "));
  z.push("\n## Cotisation (Mitgliedsbeitrag) 2026/27\n" + BEITRAEGE.map(([b, a]) => `- ${b} € ${de.beitragArt[a]}`).join("\n")
    + `\nIBAN ${IBAN}. ${de.beitrag.join(" ")} ${de.ausschluss}`
    + "\nVom Verein (11.11.2026): Jedes Mitglied des Vereins muss die Cotisation jedes Jahr zu Beginn der Saison bezahlen, um am Training und am Spielbetrieb teilnehmen zu können. Wird die Cotisation nicht bezahlt, führt das zum Ausschluss aus dem Verein beziehungsweise zum Verlust der Mitgliedschaft. Auch Non-joueurs (nicht spielende Mitglieder) zahlen die Cotisation, mit reduziertem Betrag von 120 €.");
  // Abläufe, die der Verein dem Chat mitgibt (Wissen ergänzen: hier weitere Abschnitte anfügen)
  z.push(`\n## Lizenz beantragen (neues aktives Mitglied, Spielerin/Spieler) – Ablauf des Vereins (Stand 11.11.2026)
1. Préinscription für neue Mitglieder: https://fcjj.forms.app/preinscription
2. Ärztliche Untersuchung – muss VOR der Demande de licence gemacht sein:
   - ab Poussins (POU, U11) und älter, auch WU11/WU13/WU15: Contrôle médico-sportif (Infos: https://guichet.public.lu/fr/citoyens/loisirs/activites-sportives/pratique-activite-sportive/controle-medico-sportif.html)
   - Bambinis (BAM, U7) und Pupilles (PUP, U9): kein Contrôle médico-sportif nötig, es reicht ein Certificat d'aptitude sportive vom Hausarzt.
3. Demande de licence ausfüllen: https://fcjj.forms.app/demandelicence
4. Die Demande d'affiliation FLF (PDF: ${new URL("dokumente/demande-affiliation-flf.pdf", location.href).href}) ausfüllen, unterschreiben und der Demande de licence beifügen.
5. Cotisation überweisen (Beträge und IBAN unten); sie ist Voraussetzung für Training und Spiele.
Fragen dazu: Jugendkategorien → jeunes@fcjj.lu, sonst secretaire@fcjj.lu.`);
  z.push(`\n## Commission des jeunes / Jugendkommission / Youth commission (CDJ) – vom Verein (11.11.2026)
Ziel: Jedes Kind beim FC Jeunesse Junglinster soll Fußball in einem sicheren, positiven, gut organisierten und inklusiven Umfeld genießen können.
Aufgaben:
- Gesamtorganisation des Jugendfußballs
- Helfer an der Buvette bei Jugendspielen (gelegentlich)
- Events: Organisation von WanterCup und Kleeschen
- Hilfe bei Fundraising und Sponsoring
- Unterstützung bei Spielen (délégué d'arbitre FLF)
- Unterstützung bei Medien und Kommunikation rund um den Jugendfußball
- Unterstützung der Teilnahme von FCJJ-Jugendmannschaften an internationalen Turnieren
- Wohlbefinden der Kinder
Mitmachen: ${CDJ_URL} · Kontakt: jeunes@fcjj.lu
Nächste Sitzung (Meeting) der Jugendkommission: Mittwoch, 11.11.2026 um 19:00 Uhr in der Buvette 2 „op Freinen“.`);
  z.push("\n## Sportunfall\n" + de.unfall.text.join(" ").replace("{MAIL}", UNFALL_MAIL) + " " + de.unfall.frist + " Infos: " + UNFALL_INFO);
  z.push("\n## Links\n" + LINKS.map(l => `- ${de.linkListe[l.key][0]}: ${typeof l.url === "string" ? new URL(l.url, location.href).href : l.url.de}`).join("\n")
    + `\n- Jugendkommission (CDJ) beitreten: ${CDJ_URL}\n- Spielball sponsern (Seniors): https://fcjj.lu/matchball/seniors\n- Strategischer Plan der FLF 2027–2031: https://www.flf.lu/plan-strategique-83993v4`);
  const w = warnAktiv(now); if (w.length) z.push("\n## Aktuelle Wetterwarnungen MeteoLux\n" + w.map(x => `- ${x.titel} (${warnRegion(x)}): ${x.text}`).join("\n"));
  return z.join("\n").slice(0, 38000);
}
function chatText(t) {   // Antwort sicher anzeigen: Links klickbar, **fett**, Zeilen
  return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/https?:\/\/[^\s<)]+[^\s<).,;:!?]/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`).replace(/\n/g, "<br>");
}
function chatZeigen() {
  const c = T().chat, v = document.getElementById("chatVerlauf");
  v.innerHTML = `<div class="msg ki">${esc(c.hallo)}</div>` + CHAT.map(m => `<div class="msg ${m.rolle === "user" ? "ich" : "ki"}">${m.rolle === "user" ? esc(m.text).replace(/\n/g, "<br>") : chatText(m.text)}</div>`).join("");
  v.scrollTop = v.scrollHeight;
}
function chatTexte() {
  const c = T().chat, b = document.getElementById("chatAuf");
  b.hidden = !CHAT_URL; b.textContent = c.knopf;
  document.getElementById("chatTitel").textContent = c.titel; document.getElementById("chatZu").textContent = "✕ " + c.schliessen;
  document.getElementById("chatHinweis").textContent = c.hinweis; document.getElementById("chatFrage").placeholder = c.platzhalter;
  document.getElementById("chatSenden").textContent = c.senden;
}
document.addEventListener("click", e => {
  if (e.target.closest("#chatAuf")) { chatZeigen(); document.getElementById("chat").showModal(); document.getElementById("chatFrage").focus(); }
  if (e.target.closest("#chatZu") || e.target.id === "chat") document.getElementById("chat").close();   // ✕ oder Tipp neben das Fenster
});
document.addEventListener("keydown", e => { if (e.target.id === "chatFrage" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("chatForm").requestSubmit(); } });
document.addEventListener("submit", async e => {
  if (e.target.id !== "chatForm") return;
  e.preventDefault();
  const feld = document.getElementById("chatFrage"), knopf = document.getElementById("chatSenden"), frage = feld.value.trim();
  if (!frage || knopf.disabled) return;
  const c = T().chat, verlauf = CHAT.slice(-6);
  CHAT.push({ rolle: "user", text: frage }); feld.value = ""; knopf.disabled = true; chatZeigen();
  const v = document.getElementById("chatVerlauf"); v.insertAdjacentHTML("beforeend", `<div class="msg ki leise" id="chatDenkt">${esc(c.denkt)}</div>`); v.scrollTop = v.scrollHeight;
  try {
    const r = await fetch(CHAT_URL + "/frage", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ frage, verlauf, lang: LANG, kontext: chatKontext(new Date()) }) });
    const j = await r.json().catch(() => ({}));
    CHAT.push({ rolle: "assistant", text: r.ok && j.antwort ? j.antwort : r.status === 429 ? c.limit : c.fehler });
  } catch (x) { CHAT.push({ rolle: "assistant", text: c.fehler }); }
  knopf.disabled = false; chatZeigen(); feld.focus();
});

function render() {
  if (location.hash === "#liveticker" && D?.nati?.spiele?.some(sp => FUPA_NATI[sp.id] && !vorbei(sp, new Date())) && !merk.get("reiter")) { AKTIV = "nati"; merk.set("reiter", AKTIV); }
  if (location.hash === "#liveticker" && D?.teams && !merk.get("reiter")) { const s = D.teams.find(t => FUPA_WIDGET[t.reiter]); if (s) { AKTIV = String(s.id); merk.set("reiter", AKTIV); } }
  const now = new Date();
  UMSCHALT = 0;
  document.documentElement.lang = LANG;
  for (const b of document.querySelectorAll(".sprache button")) b.setAttribute("aria-pressed", b.dataset.lang === LANG);
  document.getElementById("unterzeile").textContent = T().unterzeile;
  if (!D?.teams?.length) {
    document.getElementById("knoepfe").innerHTML = "";
    document.getElementById("inhalt").innerHTML = `<section class="karte"><h2>${T().leer}</h2><p class="hinweis">${T().leerText}</p></section>`;
    return;
  }
  if (AKTIV !== "woche" && AKTIV !== "links" && !ligaDa(AKTIV) && !(AKTIV === "nati" && D.nati?.spiele?.length) && !D.teams.some(t => String(t.id) === AKTIV)) AKTIV = "woche";
  knoepfe(now);
  const t = D.teams.find(t => String(t.id) === AKTIV);
  document.getElementById("unterzeile").textContent = t ? `${t.alter}${/\d$/.test(t.reiter) ? " " + t.nr : ""} · ${saison()}` : `${T().alle} · ${saison()}`;
  const offenAuf = [...document.querySelectorAll("#inhalt details[open] > summary")].map(s => s.textContent);
  if (AKTIV === "nati") document.getElementById("unterzeile").textContent = T().natiUnter;
  const L = ligaDa(AKTIV) ? LIGEN[AKTIV] : null;
  if (L) document.getElementById("unterzeile").textContent = L.name + (L.spiele[0] ? " · " + L.spiele[0].leagueSeason + "/" + String(L.spiele[0].leagueSeason + 1).slice(2) : "");
  if (AKTIV === "links") document.getElementById("unterzeile").textContent = T().links;
  chatTexte();
  if (Date.now() - WARN.geholt > 15 * 60e3 || WARN.lang !== LANG) warnHolen();
  ferienHolen();
  document.getElementById("inhalt").innerHTML = warnHtml(now) + (t ? teamHtml(t, now) : AKTIV === "nati" ? natiHtml(now) : L ? ligaHtml(AKTIV, now) : AKTIV === "links" ? linksHtml() : wocheHtml(now));
  if (L) ligaHolenFaellig(AKTIV, now);
  for (const s of document.querySelectorAll("#inhalt details > summary")) if (offenAuf.includes(s.textContent)) s.parentElement.open = true;
  fupaEinsetzen();
  const stand = new Date(D.stand);
  document.getElementById("teilen").textContent = T().teilen;
  document.getElementById("shop").textContent = T().shop;
  hilfeAufbauen();
  document.getElementById("fuss").innerHTML = T().fuss(`${kurzDatum(stand)} ${uhr(stand)}`, FASSUNG)
    + (fupaOk() ? `<br><button class="linkknopf" data-fupa="nein">${T().fupaAus}</button>` : "");
}
document.getElementById("knoepfe").addEventListener("click", e => {
  const b = e.target.closest("button[data-reiter]"); if (!b) return;
  AKTIV = b.dataset.reiter; merk.set("reiter", AKTIV); render(); scrollTo(0, 0);
});
document.addEventListener("click", e => {
  const f = e.target.closest("[data-fupa]"); if (!f) return;
  merk.set("fupa", f.dataset.fupa);
  if (f.dataset.fupa === "nein") location.reload(); else render();
});
document.getElementById("inhalt").addEventListener("click", e => {
  if (e.target.closest("a")) return;   // Links (Route) nicht als Reiterwechsel
  const li = e.target.closest("[data-gehe]"); if (!li) return;
  AKTIV = li.dataset.gehe; merk.set("reiter", AKTIV); render(); scrollTo(0, 0);
});

const saison = () => (D.saison?.n || "").replace(/^Saison/, T().saison);
document.querySelector(".sprache").addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]"); if (!b) return;
  LANG = b.dataset.lang; merk.set("lang", LANG); render();
});
document.querySelector("#inhalt .hinweis").textContent = T().laden;

// App teilen: Teilen-Leiste des Handys, sonst Link in die Zwischenablage. Nur `text` (mit Link darin), kein `url`:
// mit `url` lässt iMessage den Text weg.
const APP_URL = () => location.origin + location.pathname.replace(/index\.html$/, "");
document.getElementById("teilen").addEventListener("click", async () => {
  const text = T().teilText(APP_URL()), ok = document.getElementById("teilenOk");
  ok.textContent = "";
  if (navigator.share) {
    try { await navigator.share({ text }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(text); ok.textContent = T().kopiert; }
  catch (e) { ok.textContent = APP_URL(); }
});

// ---- Nützliche Links (vom Verein, 9.11.2026). Neuer Link = neue Zeile; Texte je Sprache in TEXTE.linkListe.
const LINKS = [
  { key: "website", icon: "🌐", url: "https://fcjj.lu/" },
  { key: "dokumente", icon: "🗂️", url: "https://fcjj.lu/divers" },
  { key: "kontakt", icon: "✉️", url: "https://fcjj.lu/contact" },
  { key: "preinscription", icon: "👋", url: "https://fcjj.forms.app/preinscription" },
  { key: "medico", icon: "🩺", url: { de: "https://guichet.public.lu/de/citoyens/loisirs/activites-sportives/pratique-activite-sportive/controle-medico-sportif.html",
    en: "https://guichet.public.lu/en/citoyens/loisirs/activites-sportives/pratique-activite-sportive/controle-medico-sportif.html",
    fr: "https://guichet.public.lu/fr/citoyens/loisirs/activites-sportives/pratique-activite-sportive/controle-medico-sportif.html" } },
  { key: "licence", icon: "📝", url: "https://fcjj.forms.app/demandelicence" },
  { key: "affiliation", icon: "📄", url: "dokumente/demande-affiliation-flf.pdf" },
];
// Cotisations 2026/27 (vom Verein, 9.11.2026): [Betrag, Art] — Art = Index in TEXTE.beitragArt.
const BEITRAEGE = [[220, 0], [170, 1], [120, 2], [120, 3]];
const UNFALL_MAIL = "secretaire@fcjj.lu";   // Sportunfall: Meldung an die C.S.M.S. (vom Verein, 10.11.2026)
const UNFALL_INFO = "https://sports.public.lu/fr/programs/assurances/csms.html";   // nur auf Französisch
const IBAN = "LU58 0030 0216 2326 0000";   // Vereinskonto für die Cotisation (vom Verein, 9.11.2026)
document.addEventListener("click", async e => {
  if (!e.target.closest("#ibanKopieren")) return;
  const ok = document.getElementById("ibanOk");
  try { await navigator.clipboard.writeText(IBAN.replace(/\s/g, "")); ok.textContent = "✓ " + T().kopiert2; }
  catch (x) { const r = document.createRange(); r.selectNodeContents(document.getElementById("ibanText")); getSelection().removeAllRanges(); getSelection().addRange(r); ok.textContent = T().markiert; }
});
function linksHtml() {
  return `<section class="karte"><h2>${T().links}</h2><ul class="spiele linkliste">` + LINKS.map(l => {
    const [titel, text] = T().linkListe[l.key];
    return `<li><a href="${esc(typeof l.url === "string" ? dok(l.url) : l.url[LANG] || l.url.fr)}" target="_blank" rel="noopener"><span class="lk">${l.icon}</span><span class="lt"><b>${esc(titel)}</b><span>${esc(text)}</span></span><span class="lp">›</span></a></li>`;
  }).join("") + `</ul></section>${kontaktHtml()}<details class="karte hinweisbeitrag"><summary>💶 ${T().beitragTitel}</summary>${T().beitrag.map(x => `<p>${esc(x)}</p>`).join("")}<p class="ausschluss">${esc(T().ausschluss)}</p>
    <div class="betraege"><span class="leise">${T().betraegeTitel}</span><table>${BEITRAEGE.map(([b, i]) => `<tr><td>${b} €</td><td>${esc(T().beitragArt[i])}</td></tr>`).join("")}</table></div>
    <div class="iban"><span class="leise">${T().ibanLabel}</span><code id="ibanText">${IBAN}</code>
    <button class="knopf" id="ibanKopieren" type="button">${T().kopieren}</button><span class="leise" id="ibanOk" aria-live="polite"></span></div></details>`
    + `<details class="karte hinweisbeitrag"><summary>🩹 ${T().unfall.titel}</summary>${T().unfall.text.map(x => `<p>${esc(x).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace("{MAIL}", `<a href="mailto:${UNFALL_MAIL}">${UNFALL_MAIL}</a>`)}</p>`).join("")}<p class="ausschluss">${esc(T().unfall.frist)}</p><p>${esc(T().unfall.info).replace("{INFO}", `<a href="${UNFALL_INFO}" target="_blank" rel="noopener">sports.public.lu</a>`)}</p></details>`;
}

// ---- Hilfe: App auf dem Handy installieren (iPhone / Android). Das eigene Gerät steht zuerst.
const IST_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const IST_ANDROID = /Android/.test(navigator.userAgent);
const INSTALLIERT = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
let HILFE_LANG = "";
function hilfeAufbauen() {
  if (HILFE_LANG === LANG) return;   // nur bei Sprachwechsel neu (sonst klappte der Takt sie zu)
  HILFE_LANG = LANG;
  const h = T().hilfe;
  document.getElementById("hilfeTitel").textContent = h.titel;
  const ios = `<h3>🍎 ${h.iphone}</h3><ol>${h.iosSchritte.map(x => `<li>${x}</li>`).join("")}</ol>`;
  const andr = `<h3>🤖 ${h.android}</h3><ol>${h.androidSchritte.map(x => `<li>${x}</li>`).join("")}</ol>`;
  document.getElementById("hilfeText").innerHTML = (INSTALLIERT ? `<div class="schon">✓ ${h.schon}</div>` : "")
    + `<div class="anleitung">${IST_ANDROID ? andr + ios : ios + andr}<p class="tipp">${h.tipp}</p></div>`;
}

async function laden() {
  try {
    const r = await fetch("data/fussball.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const neu = await r.json();
    D = neu; merk.set("data", JSON.stringify(neu));
  } catch (e) {
    if (!D) { try { D = JSON.parse(merk.get("data")); } catch (x) {} }
  }
  render();
}
try { D = JSON.parse(merk.get("data")); if (D) render(); } catch (e) {}
laden();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") laden(); });
// Bleibt die App offen (z. B. am Spielfeldrand), alle 5 Minuten neue Daten holen.
setInterval(() => { if (document.visibilityState === "visible") laden(); }, 5 * 60e3);
setInterval(() => { if (document.visibilityState === "visible") render(); }, 60e3);
// Countdown (letzte 15 min vor Anpfiff) und Anpfiff: alle 10 s prüfen und neu aufbauen.
setInterval(() => {
  if (document.visibilityState !== "visible" || !D?.teams) return;
  if (COUNTDOWN || (UMSCHALT && Date.now() >= UMSCHALT)) { COUNTDOWN = false; render(); }
}, 10e3);
addEventListener("resize", () => D?.teams && knoepfe(new Date()));
</script>
