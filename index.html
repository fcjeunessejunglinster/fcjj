<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FCJJ</title>
<meta name="description" content="Spiele, Ergebnisse und Tabellen der Mannschaften des FC Jeunesse Junglinster, automatisch von der FLF.">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#f4f4f2; --karte:#fff; --text:#111; --leise:#666660; --linie:#e2e2de;
  --schwarz:#111; --rot:#e31b23; --rotHell:#fde8e9; --grau:#bfbfbd;
  --sieg:#1f7a3f; --remis:#8a7a2a; --nl:#b3261e;
  --kopf:#111; --kopfText:#fff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121212; --karte:#1c1c1c; --text:#eee; --leise:#a2a29c; --linie:#2e2e2e;
  --schwarz:#eee; --rotHell:#3a1416; --sieg:#4cb873; --remis:#cdb85a; --nl:#ef6b62;
  --kopf:#000; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.innen{max-width:760px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
header{background:var(--kopf);color:var(--kopfText);padding-top:env(safe-area-inset-top,0px);border-bottom:4px solid var(--rot)}
header .innen{display:flex;align-items:center;gap:12px;padding-block:12px}
header img{width:48px;height:48px;border-radius:12px;background:#fff;flex:none}
header h1{margin:0;font-size:19px;line-height:1.1;letter-spacing:.01em}
header p{margin:3px 0 0;font-size:13px;opacity:.75}
#reiter{background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--linie)}
.raster{display:grid;grid-template-columns:repeat(60,1fr);gap:6px}
.raster button{position:relative;font-family:inherit;font-weight:600;font-size:14px;line-height:1.15;padding:10px 4px;border-radius:9px;border:1px solid var(--linie);
  background:var(--karte);color:var(--text);cursor:pointer;min-width:0;overflow-wrap:anywhere}
.raster button.woche{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:8px}
.raster button.nati{padding:5px 4px}
.raster button.nati[aria-pressed="true"]{background:var(--karte);color:var(--text);border:2px solid var(--schwarz)}
.raster button.woche small{font-weight:500;color:var(--leise)}
.raster button[aria-pressed="true"]{background:var(--schwarz);color:var(--bg);border-color:var(--schwarz)}
.raster button[aria-pressed="true"] small{color:inherit;opacity:.8}
.raster button:focus-visible{outline:3px solid var(--rot);outline-offset:1px}
main .innen{padding-block:14px 30px;display:grid;gap:14px}
.karte{background:var(--karte);border:1px solid var(--linie);border-radius:12px;overflow:hidden}
.karte>h2,.karte>summary{margin:0;padding:10px 14px;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--leise);
  border-bottom:1px solid var(--linie);font-weight:700}
details.karte>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;border-bottom:0}
details.karte>summary::after{white-space:nowrap;flex:none;margin-left:10px;content:"Anzeigen ▾";text-transform:none;letter-spacing:0;font-weight:600;color:var(--text)}
details.karte[open]>summary{border-bottom:1px solid var(--linie)}
details.karte[open]>summary::after{content:"Zuklappen ▴"}
html[lang="en"] details.karte>summary::after{content:"Show ▾"}
html[lang="en"] details.karte[open]>summary::after{content:"Hide ▴"}
html[lang="fr"] details.karte>summary::after{content:"Afficher ▾"}
html[lang="fr"] details.karte[open]>summary::after{content:"Masquer ▴"}
.sprache{margin-left:auto;display:flex;gap:4px;flex:none}
.sprache button{font:inherit;font-size:13px;font-weight:700;padding:5px 8px;border-radius:7px;border:1px solid rgba(255,255,255,.35);
  background:transparent;color:#fff;cursor:pointer}
.sprache button[aria-pressed="true"]{background:#fff;color:#111;border-color:#fff}
header .innen>div:nth-child(2){min-width:0}
.heute{border:2px solid var(--rot)}
.heute>h2{background:var(--rot);color:#fff;border-bottom:0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.heute>h2 .schild{background:#fff;color:var(--rot);margin:0}
.kasten{padding:12px 14px 14px;display:grid;gap:8px;text-align:center}
.kasten .wann{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.kasten .wann.klein{font-size:14px;font-weight:600;color:var(--leise)}
.kasten ul.spiele li{padding:4px 0;border:0}
.kasten .zusatz{font-size:14px;color:var(--leise)}
.kasten .zusatz b{color:var(--text)}
.fupa{border:2px solid var(--rot)}
.fupa .fupatext{padding:12px 14px 0;font-size:14px;color:var(--leise)}
.fupa .fupatext a{color:var(--text)}
.fupa .knopf{margin:12px 14px 4px}
.fupa .klein{padding:4px 14px 12px;font-size:12px;color:var(--leise)}
.fupa .klein a{color:var(--leise)}
.fupaplatz{padding:6px 8px;min-height:60px}
.fupaplatz .match-header-caption.live,.fupaplatz .fp-caption-text.live{border:0!important;box-shadow:none!important}
.linkknopf{background:none;border:0;padding:6px 0;font:inherit;font-size:13px;color:var(--leise);text-decoration:underline;cursor:pointer}
ul.spiele li.event{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;background:var(--rotHell)}
li.event .evt{font-weight:800;font-size:17px;color:var(--rot)}
li.event .evf{font-size:13px;font-weight:700;color:var(--leise);letter-spacing:.03em}
li.event .evd{font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}
.events{border:2px solid var(--rot)}
.raster button.blknopf{padding:5px 4px;position:relative}
.raster button.blknopf[aria-pressed="true"]{background:var(--karte);color:var(--text);border:2px solid var(--schwarz)}
.tagpunkt{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--rot);box-shadow:0 0 0 2px var(--karte)}
.raster button[aria-pressed="true"] .tagpunkt{box-shadow:0 0 0 2px var(--schwarz)}
.raster button.nati[aria-pressed="true"] .tagpunkt{box-shadow:0 0 0 2px var(--karte)}
.blknopf .livepunkt{color:var(--rot);font-size:14px;position:absolute;top:4px;right:8px}
li.sp .mitte.live{background:var(--rot);border-color:var(--rot);color:#fff}
li.sp .tore{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:0 16px;font-size:12px;color:var(--leise)}
li.sp .tore .h{text-align:right}
.livezeile{color:var(--rot);font-weight:700}
.sponsor{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;background:#fff;border:1px solid var(--linie);border-radius:12px}
.sponsor span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6a6a66}
.sponsor img{width:100%;max-width:260px;height:auto;display:block}
.wetter{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;font-size:15px;font-variant-numeric:tabular-nums}
.wetter b{font-size:18px}
.wetter .leise{font-size:13px}
.naechst + .wetter{padding:4px 14px 0}
.route{color:var(--rot);font-weight:700;text-decoration:none;white-space:nowrap}
.route:hover{text-decoration:underline}
.kasten .routeknopf{justify-self:center;font-size:16px;padding:10px 18px}
.fupalink{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;text-decoration:none;color:var(--text);font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase}
.fupalink .leise{text-transform:none;letter-spacing:0;font-weight:600}
.fupalink:hover{border-color:var(--schwarz)}
ul.spiele.linkliste li{display:block;padding:0}
.hinweisbeitrag{border:2px solid var(--rot)}
.betraege{padding:0 14px 12px}
.betraege .leise{font-size:13px}
.betraege table{margin-top:4px;font-size:15px}
.betraege td{padding:4px 0;text-align:left}
.betraege td:first-child{font-weight:800;white-space:nowrap;padding-right:14px;text-align:right;font-variant-numeric:tabular-nums}
.iban{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:0 14px 14px}
.iban .leise{font-size:13px;width:100%}
.iban code{font-size:18px;font-weight:700;letter-spacing:.03em;font-variant-numeric:tabular-nums;user-select:all}
.iban .knopf{padding:8px 14px;font-size:14px}
.hinweisbeitrag p.ausschluss{padding-top:0;font-weight:700;color:var(--rot)}
.hinweisbeitrag p{margin:0;padding:12px 14px;line-height:1.5}
.linkliste a{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px;text-decoration:none;color:var(--text)}
.linkliste .lk{font-size:24px}
.linkliste .lt{display:grid;gap:2px;min-width:0}
.linkliste .lt span{font-size:14px;color:var(--leise)}
.linkliste .lp{font-size:22px;color:var(--leise)}
.kasten .kabine{font-size:16px;font-weight:700}
.kasten .satz{font-size:16px;font-weight:700}
.rocks{font-size:24px;font-weight:900;letter-spacing:.02em;color:var(--rot);font-style:italic}
li.sp .mitte.gross{font-size:30px;padding:4px 12px;min-width:84px}
.naechst{padding:12px 14px 0;text-align:center;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.naechst span{font-size:14px;font-weight:600;color:var(--leise)}
ul.spiele li.erstes{border-top:0;padding-top:6px}
.kal{border-top:1px solid var(--linie)}
.gross{padding:14px;display:grid;gap:6px}
.gross .zeit{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.gross .gegen{font-size:18px;font-weight:700}
.leise{color:var(--leise);font-size:14px}
ul.spiele{list-style:none;margin:0;padding:0}
ul.spiele li{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--linie)}
ul.spiele li:first-child{border-top:0}
ul.spiele li.klick{cursor:pointer}
/* Spielzeile wie in der Koeppchen-App: Heim rechtsbündig | Ergebnis/Uhrzeit | Gast, darunter Datum und Klasse */
ul.spiele li.sp{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:4px 10px;align-items:center}
li.sp .tm{font-size:15px;line-height:1.2;overflow-wrap:anywhere}
li.sp .tm.h{text-align:right}
li.sp .tm.wir{font-weight:800}
li.sp .mitte{min-width:64px;text-align:center;font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap;
  border-radius:8px;padding:3px 8px;background:var(--bg);border:1px solid var(--linie)}
li.sp .mitte.S{background:var(--sieg);border-color:var(--sieg);color:#fff}
li.sp .mitte.U{background:var(--grau);border-color:var(--grau);color:#111}
li.sp .mitte.N{background:var(--schwarz);border-color:var(--schwarz);color:var(--bg)}
li.sp .mitte.zeit{font-size:16px}
li.sp .mitte.leise{font-size:13px;font-weight:700;color:var(--leise)}
li.sp .unten{grid-column:1/-1;text-align:center;font-size:13px;color:var(--leise);overflow-wrap:anywhere}
li.sp .unten b{color:var(--text);font-weight:600}
.datum{font-size:13px;line-height:1.25;color:var(--leise);font-variant-numeric:tabular-nums}
.datum b{color:var(--text);font-size:14px}
.zeile{min-width:0}
.zeile .t{font-weight:600;overflow-wrap:anywhere}
.zeile .m{font-size:13px;color:var(--leise);overflow-wrap:anywhere}
.schild{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:5px;
  background:var(--rotHell);color:var(--rot);margin-right:6px;vertical-align:1px}
.schild.team{background:var(--schwarz);color:var(--bg)}
.erg{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;padding:2px 8px;border-left:4px solid var(--linie);white-space:nowrap}
.erg.S{border-color:var(--sieg)}.erg.U{border-color:var(--remis)}.erg.N{border-color:var(--nl)}
.erg.klein{font-size:13px;font-weight:600;color:var(--leise)}
.uhr{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabrahmen{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 6px;text-align:center}
th{font-size:12px;color:var(--leise);font-weight:600}
td:nth-child(2),th:nth-child(2){text-align:left}
tbody tr+tr td{border-top:1px solid var(--linie)}
tr.wir td{background:var(--rotHell);font-weight:700}
tr.wir td:first-child{box-shadow:inset 4px 0 var(--rot)}
.tag{padding:8px 14px;font-weight:700;font-size:14px;background:var(--bg);border-top:1px solid var(--linie)}
.knopf{display:inline-block;font-family:inherit;font-weight:600;font-size:15px;text-decoration:none;color:#fff;background:var(--schwarz);
  border:0;border-radius:10px;padding:11px 14px;cursor:pointer}
@media (prefers-color-scheme:dark){.knopf{color:#111}}
.kal{padding:14px;display:grid;gap:8px}
.kal code{font-size:12px;overflow-wrap:anywhere;color:var(--leise)}
.hinweis{padding:14px;color:var(--leise)}
footer{text-align:center;font-size:13px;color:var(--leise);padding:0 14px 30px}
.teilen{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 14px 22px}
.teilen .knopf{font-size:16px;padding:12px 22px}
.unten-knoepfe{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
#shop{background:var(--rot);color:#fff}
.hilfe{margin:0 auto 18px;max-width:732px}
#hilfe{width:calc(100% - 2 * max(14px, env(safe-area-inset-left, 0px)))}
.hilfe .anleitung{padding:4px 14px 14px}
.hilfe h3{margin:14px 0 6px;font-size:16px}
.hilfe ol{margin:0;padding-left:22px;display:grid;gap:6px}
.hilfe .tipp{margin:10px 0 0;font-size:14px;color:var(--leise)}
.hilfe .schon{padding:14px;color:var(--sieg);font-weight:700}
.teilen .ok{font-size:13px;color:var(--leise);min-height:1.2em}
@media (min-width:600px){.raster button{font-size:15px}}
</style>
</head>

// ---- Mannschaft ----

// „Letztes Spiel“ (bis 7 Tage; Kinder bis zum Vortag des nächsten, sonst bis zum Spieltag).
const KINDER = ["U7", "U9", "U11", "U13", "U15", "WU11", "WU13", "WU15"];
const tageBis = (a, b) => Math.round((Date.parse(b + "T12:00:00Z") - Date.parse(a + "T12:00:00Z")) / 864e5);
const zeitText = sp => offen(sp) ? T().zeitOffen : (sp.bam && !sp.bam.zeitSicher ? T().ca : "") + uhr(new Date(sp.d)) + T().uhr;
const wannText = sp => `${wt(new Date(sp.d))} ${kurzDatum(new Date(sp.d))} · ${zeitText(sp)}`;
const schildText = sp => sp.bam ? "" : sp.typ === "CUP" ? T().cup : sp.typ === "FM" ? T().friendly : sp.wett === "Testspiele" ? T().friendly : "";
const kopf = (titel, sp, rechts) => `<h2><span>${titel}</span>${rechts ? `<span class="schild">${esc(rechts)}</span>` : sp && schildText(sp) ? `<span class="schild">${esc(schildText(sp))}</span>` : ""}</h2>`;
const kastenZeile = (sp, now, m) => `<ul class="spiele">${zeile(sp, now, { wirH: sp.heim, wirA: !sp.heim, erg: sp.erg, w: wertung(sp), unten: "", m })}</ul>`.replace('<span class="unten"></span>', "");
let UMSCHALT = 0;   // Zeitpunkt, zu dem der Heute-Kasten umschaltet (Countdown, Anpfiff) — der Takt baut dann neu.
function spieltagHeute(spiele, now) {
  const sp = spiele.find(s => tagKey(new Date(s.d)) === tagKey(now) && !(s.gespielt && s.hs != null) && !vorbei(s, now));

function heuteHtml(h, now, kinder) {

    <div class="satz">${esc(T().trinken)}</div></div></section>`;

// Slogan nach einem Sieg einer Jugendmannschaft (alle außer Seniors, Réserves und Veteranen; vom Verein, 8.11.2026).
const ROCKS = '<div class="rocks">YOUth ROCKs! 🤘</div>';
const rocks = (t, sp) => !["SEN", "RES", "VET"].includes(t.kat) && wertung(sp) === "S" && (sp.gespielt || sp.forfait) ? ROCKS : "";
function letztesHtml(t, spiele, now, aktuell, kinder) {
  if (spieltagHeute(spiele, now) || (kinder && spieltagMorgen(spiele, now))) return "";
  const vorbeiL = spiele.filter(s => vorbei(s, now) && new Date(s.d) <= now).reverse();
  const datum = sp => `${wt(new Date(sp.d))} ${kurzDatum(new Date(sp.d))}`;
  if (!kinder) {
    // Erwachsene: Ergebnis groß, Klasse und Platz. Auch ohne FLF-Ergebnis („Ergebnis folgt“), dann nur bis 48 h.
    const mitErg = s => s.erg && s.hs != null && (s.gespielt || s.forfait);
    const sp = vorbeiL.find(s => mitErg(s) || now - new Date(s.d) <= 48 * 3600e3);
    if (!sp || now - new Date(sp.d) > 7 * 864e5) return "";
    const erg = mitErg(sp), liga = aktuell && aktuell.spiele.some(x => x.id === sp.id);

    const unten = [liga ? esc(aktuell.n) : esc(sp.klasse), zeileTab ? T().platz(zeileTab.pl) : ""].filter(Boolean).join(" · ");

  return `<section class="karte heute">${kopf(T().letztes, sp)}<div class="kasten"><div class="wann klein">${esc(datum(sp))}</div>
    <div class="satz">${esc(T().super(t.reiter))}</div>${kastenZeile(sp, now)}${rocks(t, sp)}${naechst}</div></section>`;

function tabelleKarte(k, t) {

    <thead><tr><th>#</th>${T().kopf.map(x => `<th>${x}</th>`).join("")}</tr></thead><tbody>${zeilen}</tbody></table></div></section>`;

function klassenSpiele(k, t, now) {

  for (const sp of k.spiele) { const key = sp.tag ? T().spieltag + " " + sp.tag : T().ohneTag; if (!tage.has(key)) tage.set(key, []); tage.get(key).push(sp); }

    html += liste.map(sp => {

function teamHtml(t, now) {

  const tickerTest = location.hash === "#liveticker" && FUPA_WIDGET[t.reiter];

    + (morgen ? morgenHtml(morgen, now) : "") + letztesHtml(t, spiele, now, aktuell, kinder);

// „Nächste Spiele“: das erste mit Datum, Uhrzeit und „in 3 Tagen“ hervorgehoben, höchstens fünf; Kalender-Knopf darunter.

// ---- Wetter am Spielort zur Anstoßzeit (Open-Meteo, frei, ohne Schlüssel). Koordinaten der Orte holt der Abruf
// (D.orte, aus dem Platznamen). Nur für Spiele in den nächsten 7 Tagen; ohne Uhrzeit das Wetter um 14 Uhr.
const WETTER = new Map();   // "lat,lon" → { stunden: {zeit → [temp, regen%, code, wind]}, geholt, laedt }
function stadtAus(ort) {
  if (!ort) return null;
  const k = ort.match(/\(([^,)]+)/)?.[1]?.trim();
  if (k && !/^synth/i.test(k)) return k;
  const w = ort.replace(/\(.*\)/, "").trim().split(/\s+/).filter(x => !/^(stade|terrain|am|um|an|in|de|du|des|la|le|rue|\d+)$/i.test(x));
  return w.length ? w[w.length - 1] : null;
}
function koordinaten(sp) {
  const st = stadtAus(sp.ort);
  return (st && D?.orte?.staedte?.[st]) || (sp.heim && !sp.bam && !sp.ort ? D?.orte?.heim : null) || null;
}
async function wetterHolen(key) {
  const w = WETTER.get(key) || {}; if (w.laedt) return;
  WETTER.set(key, { ...w, laedt: true });
  const [lat, lon] = key.split(",");
  try {
    const r = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m&timezone=Europe%2FLuxembourg&forecast_days=8`)).json();
    const st = {};
    r.hourly.time.forEach((z, i) => st[z] = [r.hourly.temperature_2m[i], r.hourly.precipitation_probability[i], r.hourly.weather_code[i], r.hourly.wind_speed_10m[i]]);
    WETTER.set(key, { stunden: st, geholt: Date.now(), laedt: false });
  } catch (e) { WETTER.set(key, { ...w, geholt: Date.now(), laedt: false }); }
  render();
}
// WMO-Wettercode → Symbol und Text
function wetterArt(c) {
  const a = c === 0 ? 0 : c <= 2 ? 1 : c === 3 ? 2 : c <= 48 ? 3 : c <= 57 ? 4 : c <= 67 ? 5 : c <= 77 ? 6 : c <= 82 ? 5 : c <= 86 ? 6 : 7;
  return [["☀️", ...T().wetter[0]], ["🌤", ...T().wetter[1]], ["☁️", ...T().wetter[2]], ["🌫", ...T().wetter[3]], ["🌦", ...T().wetter[4]],
    ["🌧", ...T().wetter[5]], ["🌨", ...T().wetter[6]], ["⛈", ...T().wetter[7]]][a];
}
function wetterHtml(sp, now) {
  const d = new Date(sp.d);
  if (d - now > 7 * 864e5 || vorbei(sp, now)) return "";
  const k = koordinaten(sp); if (!k) return "";
  const key = k.join(","), w = WETTER.get(key);
  if (!w || (!w.laedt && Date.now() - (w.geholt || 0) > 3600e3)) wetterHolen(key);
  if (!w?.stunden) return "";
  const stunde = offen(sp) ? "14:00" : uhr(d).slice(0, 2) + ":00";
  const x = w.stunden[`${tagKey(d)}T${stunde}`]; if (!x) return "";
  const [sym, text] = wetterArt(x[2]);
  return `<div class="wetter"><span>${sym}</span><b>${Math.round(x[0])}°</b><span>${esc(text)}</span>`
    + `<span class="leise">· 💧 ${x[1] ?? 0} % · 💨 ${Math.round(x[3])} km/h${offen(sp) ? " · " + T().wetterMittag : ""}</span></div>`;
}

// Das Widget-Element bleibt über alle Neuaufbauten dasselbe (der Inhalt wird jede Minute neu gebaut) und wird nach jedem

// Das Widget aktualisiert sich nicht von selbst (nur Knopf ↻). Die App tippt ihn an: jede Minute von 15 min vor bis
// 3 h nach Anpfiff, solange die App vorne ist, und sofort beim Zurückkommen.
function fupaAktualisieren() {

  }

// ---- Ligen live aus OpenLigaDB (frei, ohne Schlüssel, CORS offen; am 8.11.2026 geprüft) ----
// Bundesliga für alle. `sprachen` beschränkt eine Liga auf bestimmte Sprachfassungen.
// Der Browser fragt direkt: aktueller Spieltag + Tabelle. Läuft ein Spiel, jede Minute neu, sonst alle 10 Minuten.
const BL_API = "https://api.openligadb.de/";
const LIGEN = {
  bl: { api: "bl1", name: "1. Bundesliga", logo: "bilder/bundesliga.png", sprachen: null },
  // Premier League: am 8.11.2026 eingebaut und wieder herausgenommen (vom Verein) — bei OpenLigaDB waren die Ergebnisse
  // des laufenden Spieltags am Sonntagabend noch nicht eingetragen. Mit besserer Quelle wieder einschalten:
  // pl: { api: "pl", name: "Premier League", logo: null, sprachen: ["en"] },
};
for (const L of Object.values(LIGEN)) Object.assign(L, { spiele: [], tabelle: [], geholt: 0, fehler: false, laedt: false });
const ligaDa = key => !!LIGEN[key] && (!LIGEN[key].sprachen || LIGEN[key].sprachen.includes(LANG));
const ligaKeys = () => Object.keys(LIGEN).filter(ligaDa);
const blAnstoss = m => new Date(m.matchDateTimeUTC);
const blLive = (m, now) => !m.matchIsFinished && now >= blAnstoss(m) && now - blAnstoss(m) < 150 * 60e3;
const ligaLaeuft = (L, now) => L.spiele.some(m => blLive(m, now));
function blStand(m) {
  const g = m.goals?.length ? m.goals[m.goals.length - 1] : null;
  const ende = m.matchResults?.find(r => r.resultTypeID === 2);
  if (m.matchIsFinished && ende) return [ende.pointsTeam1, ende.pointsTeam2];
  if (g) return [g.scoreTeam1, g.scoreTeam2];
  if (ende) return [ende.pointsTeam1, ende.pointsTeam2];
  return [0, 0];
}
// Spielminute grob aus dem Anstoß (45 + 15 Pause + 45); OpenLigaDB liefert keine laufende Minute.
function blMinute(m, now) {
  const min = Math.floor((now - blAnstoss(m)) / 60e3) + 1;
  if (min <= 45) return min + "'";
  if (min <= 47) return "45+'";
  if (min <= 62) return T().blHz;
  return min - 17 <= 90 ? (min - 17) + "'" : "90+'";
}
async function ligaHolen(key) {
  const L = LIGEN[key];
  if (L.laedt) return;
  L.laedt = true;
  try {
    const sp = await (await fetch(BL_API + "getmatchdata/" + L.api, { cache: "no-store" })).json();
    L.spiele = sp.sort((a, b) => a.matchDateTimeUTC.localeCompare(b.matchDateTimeUTC)); L.fehler = false;
    const saison = sp[0]?.leagueSeason;
    if (saison) try { L.tabelle = await (await fetch(BL_API + "getbltable/" + L.api + "/" + saison, { cache: "no-store" })).json(); } catch (e) {}
  } catch (e) { L.fehler = true; }

  if (AKTIV === key) render(); else if (D?.teams) knoepfe(new Date());
}
function ligaHolenFaellig(key, now) {
  const L = LIGEN[key];
  const bald = L.spiele.some(m => !m.matchIsFinished && blAnstoss(m) - now < 15 * 60e3 && now - blAnstoss(m) < 150 * 60e3);
  if (Date.now() - L.geholt > (bald ? 55e3 : 10 * 60e3)) ligaHolen(key);
}
setInterval(() => { if (document.visibilityState === "visible" && ligaDa(AKTIV)) ligaHolenFaellig(AKTIV, new Date()); }, 15e3);
function blTore(m) {

  const z = (g, team) => (g.scoringTeamId ?? (g.scoreTeam1 > (m.goals[m.goals.indexOf(g) - 1]?.scoreTeam1 ?? 0) ? m.team1.teamId : m.team2.teamId)) === team;
  const txt = g => `${g.matchMinute ?? "?"}' ${esc(g.goalGetterName || "")}${g.isPenalty ? ` (${T().elf})` : ""}${g.isOwnGoal ? ` (${T().eigentor})` : ""}`;
  const h = m.goals.filter(g => z(g, m.team1.teamId)).map(txt).join("<br>"), a = m.goals.filter(g => z(g, m.team2.teamId)).map(txt).join("<br>");
  return `<span class="tore"><span class="h">${h}</span><span>${a}</span></span>`;
}
function ligaHtml(key, now) {

  if (L.fehler && !L.spiele.length) return `<section class="karte"><p class="hinweis">${T().blFehler(L.name)}</p></section>`;
  const tage = new Map();
  for (const m of L.spiele) { const k = tagKey(blAnstoss(m)); if (!tage.has(k)) tage.set(k, []); tage.get(k).push(m); }
  const runde = (L.spiele[0]?.group?.groupName || L.name).replace(/^(\d+)\. Spieltag$/, (x, n) => LANG === "de" ? x : LANG === "en" ? "Matchday " + n : n + "e journée");
  let html = `<section class="karte${ligaLaeuft(L, now) ? " heute" : ""}"><h2>${esc(runde)}</h2>`;
  for (const [tag, liste] of tage) {
    html += `<div class="tag">${esc(langDatum(new Date(tag + "T12:00:00Z")))}</div><ul class="spiele">` + liste.map(m => {
      const live = blLive(m, now), [a, b] = blStand(m), d = blAnstoss(m);
      const mitte = m.matchIsFinished || live ? `<span class="mitte${live ? " live" : ""}">${a} : ${b}</span>` : `<span class="mitte zeit">${uhr(d)}</span>`;
      const unten = live ? `<span class="livezeile">● ${T().blLive} · ${blMinute(m, now)}</span>` : m.matchIsFinished ? T().blEnde : esc(m.location?.locationStadium || "");
      return `<li class="sp"><span class="tm h">${esc(m.team1.shortName || m.team1.teamName)}</span>${mitte}<span class="tm">${esc(m.team2.shortName || m.team2.teamName)}</span>`
        + `${blTore(m)}<span class="unten">${unten}</span></li>`;
    }).join("") + "</ul>";
  }
  html += "</section>";
  if (L.tabelle?.length) {
    const zeilen = L.tabelle.map((z, i) => `<tr><td>${i + 1}</td><td>${esc(z.shortName || z.teamName)}</td><td>${z.matches}</td><td>${z.won}</td><td>${z.draw}</td><td>${z.lost}</td><td>${z.goals}:${z.opponentGoals}</td><td><b>${z.points}</b></td></tr>`).join("");
    html += `<section class="karte"><h2>${T().blTab(L.name)}</h2><div class="tabrahmen"><table><thead><tr><th>#</th>${T().kopf.map(x => `<th>${x}</th>`).join("")}</tr></thead><tbody>${zeilen}</tbody></table></div></section>`;
  }
  return html + `<p class="leise" style="text-align:center;margin:0">${T().blQuelle(L.name)}</p>`;
}
function ligaKnopf(key, breite) {
  const L = LIGEN[key];
  const inhalt = L.logo ? `<img src="${L.logo}" alt="${esc(L.name)}" height="40" style="display:block;margin:auto;height:40px;width:auto">` : esc(L.name);
  return `<button class="blknopf" style="grid-column:span ${breite}" data-reiter="${key}" aria-pressed="${AKTIV === key}" aria-label="${esc(L.name)}" title="${esc(L.name)}">${inhalt}${ligaLaeuft(L, new Date()) ? '<span class="livepunkt">●</span>' : ""}</button>`;

// ---- Unsere Woche: alle Spiele aller Mannschaften, Montag bis Sonntag ----
function wocheTage(now) {
  let heute = tagKey(now);
  const p = teile(now);
  // Sonntagabend ab 22 Uhr zeigt schon die nächste Woche.
  if (p.weekday.startsWith("So") && +p.hour >= 22) heute = tagPlus(heute, 1);
  const [y, m, d] = heute.split("-").map(Number);
  const wtag = (new Date(Date.UTC(y, m - 1, d)).getUTCDay() + 6) % 7;
  const montag = tagPlus(heute, -wtag);
  return Array.from({ length: 7 }, (_, i) => tagPlus(montag, i));
}
function wocheSpiele(now) {
  const tage = new Set(wocheTage(now)), gesehen = new Set(), aus = [];
  // Ein Spiel nur einmal. Gehört es nicht einer Mannschaft selbst (Pokal ohne I/II, hängt an allen
  // derselben Altersklasse), steht die Altersklasse da („MIN“ statt MIN 1, MIN 2, …).
  for (const t of D.teams) for (const sp of eigeneSpiele(t)) {
    if (!tage.has(tagKey(new Date(sp.d)))) continue;
    const eigen = t.ids.includes(sp.h.id) || t.ids.includes(sp.a.id);
    const key = sp.id + "|" + (eigen ? t.id : t.kat);
    if (gesehen.has(key)) continue;
    gesehen.add(key);
    aus.push(eigen ? sp : { ...sp, team: { ...t, reiter: t.reiter.replace(/ \d+$/, "") } });
  }
  return aus.sort((a, b) => a.d.localeCompare(b.d));
}
// ---- Events des Vereins (von Hand eingetragen). Neues Event = neue Zeile: von/bis als Datum, Titel, Zusatz optional.
// kats: für welche Altersklassen (Schlüssel wie in D.teams[].kat) — das Event steht dann auch in deren Reitern.
const EVENTS = [
  { von: "2026-12-03", t: "Kleeschen", icon: "🎅", kats: ["U7", "U9", "U11", "U13", "WU11", "WU13"], fuer: "BAM · PUP · POU · MIN · WU11 · WU13" },
  { von: "2027-01-09", bis: "2027-01-10", t: "WanterCup27", kats: ["U7", "U9", "U11", "U13", "WU11", "WU13"], fuer: "BAM · PUP · POU · MIN · WU11 · WU13" },
];
function eventDatum(e) {
  const a = new Date(e.von + "T12:00:00Z"), b = new Date((e.bis || e.von) + "T12:00:00Z");
  return e.bis && e.bis !== e.von ? `${wt(a)} ${kurzDatum(a)} – ${wt(b)} ${kurzDatum(b)}${LANG === "de" ? b.getUTCFullYear() : " " + b.getUTCFullYear()}`
    : `${wt(a)} ${kurzDatum(a)}${LANG === "de" ? a.getUTCFullYear() : " " + a.getUTCFullYear()}`;
}
const kommendeEvents = now => EVENTS.filter(e => (e.bis || e.von) >= tagKey(now)).sort((a, b) => a.von.localeCompare(b.von));
const eventAmTag = tag => EVENTS.filter(e => e.von <= tag && tag <= (e.bis || e.von));
function eventZeile(e, now, mitBis = true) {
  const n = tageBis(tagKey(now), e.von);
  const wann = e.von <= tagKey(now) ? T().bis(0) : n <= 60 ? T().bis(n) : "";
  return `<li class="event"><span class="evt">${e.icon || "🏆"} ${esc(e.t)}</span><span class="evd">${esc(eventDatum(e))}${mitBis && wann ? ` · ${esc(wann)}` : ""}</span>${e.fuer ? `<span class="evf">${esc(T().fuer)} ${esc(e.fuer)}</span>` : ""}${e.zusatz ? `<span class="evd">${esc(e.zusatz)}</span>` : ""}</li>`;
}
function eventsKarte(now, kat) {
  const liste = kommendeEvents(now).filter(e => !kat || (e.kats || []).includes(kat));
  if (!liste.length) return "";
  return `<section class="karte events"><h2>${T().events} · Save the date</h2><ul class="spiele">${liste.map(e => eventZeile(e, now)).join("")}</ul></section>`;
}

function wocheHtml(now) {
  const tage = wocheTage(now), spiele = wocheSpiele(now);
  const heim = spiele.filter(sp => sp.heim).length;
  const von = new Date(tage[0] + "T12:00:00Z"), bis = new Date(tage[6] + "T12:00:00Z");

    <p class="hinweis" style="padding-block:10px">${spiele.length ? T().wocheText(spiele.length, heim) : T().keineWoche}</p>`;
  for (const tag of tage) {

// Raster aus 60 Spalten: volle Reihen 4 (Handy) bzw. 6 Knöpfe, die letzte Reihe teilt sich die Breite.
function spannen(n) {
  const je = matchMedia("(min-width:600px)").matches ? 6 : 4;
  const rest = n % je || je;
  return Array.from({ length: n }, (_, i) => i >= n - rest ? 60 / rest : 60 / je);
}
// Roter Punkt am Reiter, wenn die Mannschaft heute spielt (der ganze Spieltag, auch nach dem Spiel).

    .concat(ligaKeys().map(k => ligaKnopf(k, 60 / (ligaKeys().length + (D.nati?.spiele?.length ? 1 : 0)))))

const saison = () => (D.saison?.n || "").replace(/^Saison/, T().saison);
document.querySelector(".sprache").addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]"); if (!b) return;
  LANG = b.dataset.lang; merk.set("lang", LANG); render();
});
document.querySelector("#inhalt .hinweis").textContent = T().laden;

// App teilen: Teilen-Leiste des Handys, sonst Link in die Zwischenablage. Nur `text` (mit Link darin), kein `url`:
// mit `url` lässt iMessage den Text weg (in der Koeppchen-App so gesehen).
const APP_URL = () => location.origin + location.pathname.replace(/index\.html$/, "");
document.getElementById("teilen").addEventListener("click", async () => {
  const text = T().teilText(APP_URL()), ok = document.getElementById("teilenOk");
  ok.textContent = "";
  if (navigator.share) {
    try { await navigator.share({ text }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(text); ok.textContent = T().kopiert; }
  catch (e) { ok.textContent = APP_URL(); }
});

// ---- Nützliche Links (vom Verein, 9.11.2026). Neuer Link = neue Zeile; Texte je Sprache in TEXTE.linkListe.
const LINKS = [
  { key: "website", icon: "🌐", url: "https://fcjj.lu/" },
  { key: "dokumente", icon: "🗂️", url: "https://fcjj.lu/divers" },
  { key: "kontakt", icon: "✉️", url: "https://fcjj.lu/contact" },
  { key: "preinscription", icon: "👋", url: "https://fcjj.forms.app/preinscription" },
  { key: "medico", icon: "🩺", url: "https://guichet.public.lu/fr/citoyens/loisirs/activites-sportives/pratique-activite-sportive/controle-medico-sportif.html#accordionItem-accordionitem_services_en_ligne_et_formulaires" },
  { key: "licence", icon: "📝", url: "https://fcjj.forms.app/demandelicence" },
  { key: "affiliation", icon: "📄", url: "dokumente/demande-affiliation-flf.pdf" },
];
// Cotisations 2026/27 (vom Verein, 9.11.2026): [Betrag, Art] — Art = Index in TEXTE.beitragArt.
const BEITRAEGE = [[220, 0], [170, 1], [120, 2], [120, 3]];
const IBAN = "LU58 0030 0216 2326 0000";   // Vereinskonto für die Cotisation (vom Verein, 9.11.2026)
document.addEventListener("click", async e => {
  if (!e.target.closest("#ibanKopieren")) return;
  const ok = document.getElementById("ibanOk");
  try { await navigator.clipboard.writeText(IBAN.replace(/\s/g, "")); ok.textContent = "✓ " + T().kopiert2; }
  catch (x) { const r = document.createRange(); r.selectNodeContents(document.getElementById("ibanText")); getSelection().removeAllRanges(); getSelection().addRange(r); ok.textContent = T().markiert; }
});
function linksHtml() {
  return `<section class="karte"><h2>${T().links}</h2><ul class="spiele linkliste">` + LINKS.map(l => {
    const [titel, text] = T().linkListe[l.key];
    return `<li><a href="${esc(l.url)}" target="_blank" rel="noopener"><span class="lk">${l.icon}</span><span class="lt"><b>${esc(titel)}</b><span>${esc(text)}</span></span><span class="lp">›</span></a></li>`;
  }).join("") + `</ul></section><details class="karte hinweisbeitrag"><summary>💶 ${T().beitragTitel}</summary><p>${esc(T().beitrag)}</p><p class="ausschluss">${esc(T().ausschluss)}</p>
    <div class="betraege"><span class="leise">${T().betraegeTitel}</span><table>${BEITRAEGE.map(([b, i]) => `<tr><td>${b} €</td><td>${esc(T().beitragArt[i])}</td></tr>`).join("")}</table></div>
    <div class="iban"><span class="leise">${T().ibanLabel}</span><code id="ibanText">${IBAN}</code>
    <button class="knopf" id="ibanKopieren" type="button">${T().kopieren}</button><span class="leise" id="ibanOk" aria-live="polite"></span></div></details>`;
}

// ---- Hilfe: App auf dem Handy installieren (iPhone / Android). Das eigene Gerät steht zuerst.
const IST_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const IST_ANDROID = /Android/.test(navigator.userAgent);
const INSTALLIERT = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
let HILFE_LANG = "";
function hilfeAufbauen() {
  if (HILFE_LANG === LANG) return;   // nur bei Sprachwechsel neu (sonst klappte der Takt sie zu)
  HILFE_LANG = LANG;
  const h = T().hilfe;
  document.getElementById("hilfeTitel").textContent = h.titel;
  const ios = `<h3>🍎 ${h.iphone}</h3><ol>${h.iosSchritte.map(x => `<li>${x}</li>`).join("")}</ol>`;
  const andr = `<h3>🤖 ${h.android}</h3><ol>${h.androidSchritte.map(x => `<li>${x}</li>`).join("")}</ol>`;
  document.getElementById("hilfeText").innerHTML = (INSTALLIERT ? `<div class="schon">✓ ${h.schon}</div>` : "")
    + `<div class="anleitung">${IST_ANDROID ? andr + ios : ios + andr}<p class="tipp">${h.tipp}</p></div>`;
}

async function laden() {
  try {
    const r = await fetch("data/fussball.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const neu = await r.json();
    D = neu; merk.set("data", JSON.stringify(neu));
  } catch (e) {
    if (!D) { try { D = JSON.parse(merk.get("data")); } catch (x) {} }
  }
  render();
}
try { D = JSON.parse(merk.get("data")); if (D) render(); } catch (e) {}
laden();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") laden(); });
// Bleibt die App offen (z. B. am Spielfeldrand), alle 5 Minuten neue Daten holen.
setInterval(() => { if (document.visibilityState === "visible") laden(); }, 5 * 60e3);
setInterval(() => { if (document.visibilityState === "visible") render(); }, 60e3);
// Countdown (letzte 15 min vor Anpfiff) und Anpfiff: alle 10 s prüfen und neu aufbauen.
setInterval(() => {
  if (document.visibilityState !== "visible" || !D?.teams) return;
  if (COUNTDOWN || (UMSCHALT && Date.now() >= UMSCHALT)) { COUNTDOWN = false; render(); }
}, 10e3);
addEventListener("resize", () => D?.teams && knoepfe(new Date()));
</script>
