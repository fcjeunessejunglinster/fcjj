name: probe
on: { push: { paths: [".github/workflows/probe.yml"] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          for k in U9 U11 U13 U15 U17 U19 WU11 WU13 WU15; do curl -sS -m 30 "https://fcjj1.gilles-emeringer.workers.dev/live?kat=$k" -o $k.json; done
          date -u > zeit.txt
      - run: |
          cd out && git init -q && git checkout -q -b probe-daten && git add . && git -c user.name=probe -c user.email=p@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-daten
