name: probe
on: { push: { paths: [".github/workflows/probe.yml"] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          W=https://fcjj1.gilles-emeringer.workers.dev
          curl -sS -m 30 "$W/buvette?ids=20261128-1400,20261128-1600,20261128-1800e,20261129-0930,20261129-1100e,20261129-1330e,20261129-1600s,20261205-1100" -o buvette.json
          curl -sS -m 30 "$W/buvette/mail" -o mail.txt -w " %{http_code}"  > mail.code
      - run: |
          cd out && git init -q && git checkout -q -b probe-daten && git add . && git -c user.name=probe -c user.email=p@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-daten
