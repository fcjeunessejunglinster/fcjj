name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          mkdir out && cd out
          q() { curl -sS -H "x-apisports-key: $K" "https://v3.football.api-sports.io/$1" -o "$2"; sleep 1; }
          q "standings?league=5&season=2026" tabelle-alle.json
          q "players?team=1102&season=2026&page=2" spieler2.json
          q "leagues?id=5&current=true" nl.json
          cd .. && git init -q pd && cp out/* pd/ && cd pd && git add -A && git -c user.name=p -c user.email=p@p commit -qm p
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-daten
