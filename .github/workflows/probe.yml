name: probe
on: { push: { paths: [".github/workflows/probe.yml"] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          for id in 500062 1 99999999; do curl -sS -m 30 -D h$id.txt -o l$id.bin "https://extranet.flf.lu/api/export/clublogo/$id"; file l$id.bin >> info.txt; done
          curl -sS -m 30 -X POST https://extranet.flf.lu/api/graphql -H 'content-type: application/json' -d '{"query":"query($c: MatchCriteria){ rankings(criteria:$c){ team{ id name clubId1 } } }","variables":{"c":{"teamId":44720}}}' -o r.json
          ls -la >> info.txt
      - run: |
          cd out && git init -q && git checkout -q -b probe-daten && git add . && git -c user.name=probe -c user.email=p@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-daten
