name: Probe (einmalig)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -D - -o m.json -H "Origin: https://fcjeunessejunglinster.github.io" https://api.openligadb.de/getmatchdata/bl1 | grep -i -E "^HTTP|access-control|cache-control"
          python3 -c "import json;d=json.load(open('m.json'));print(len(d));print(json.dumps(d[0],ensure_ascii=False)[:2500])"
          curl -s https://api.openligadb.de/getbltable/bl1/2026 | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d));print(json.dumps(d[0],ensure_ascii=False))"
          curl -s https://api.openligadb.de/getcurrentgroup/bl1
          echo; curl -s https://api.openligadb.de/getlastchangedate/bl1/2026/10
