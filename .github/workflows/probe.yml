name: Probe (einmalig)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/probe-osm.mjs
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git checkout -b probe-daten
          git add -f osm-plaetze.json && git commit -m "OSM-Plätze (Probe)" && git push -f origin probe-daten
