name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          mkdir out && cd out
          echo "laenge=${#K}"
          q() { curl -sS -H "x-apisports-key: $K" "https://v3.football.api-sports.io/$1" -o "$2"; }
          q "status" status.json
          q "leagues?id=78&current=true" liga.json
          q "teams?league=78&season=2026" teams2026.json
          q "players/squads?team=157" kader157.json
          cd .. && git init -q pd && cp out/* pd/ && cd pd && git add -A && git -c user.name=p -c user.email=p@p commit -qm p
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-daten
