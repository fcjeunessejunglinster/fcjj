name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          for u in https://newsfeed.kicker.de/news/bundesliga https://newsfeed.kicker.de/news/champions-league https://newsfeed.kicker.de/news/europa-league https://newsfeed.kicker.de/news/aktuell https://newsfeed.kicker.de/news/international \
                   https://www.uefa.com/rss/uefachampionsleague/rss.xml https://www.uefa.com/rss/uefaeuropaleague/rss.xml https://www.uefa.com/rss/uefaeuro/rss.xml https://fr.uefa.com/rss/uefachampionsleague/rss.xml https://de.uefa.com/rss/uefachampionsleague/rss.xml \
                   https://feeds.bbci.co.uk/sport/football/european/rss.xml https://feeds.bbci.co.uk/sport/football/rss.xml https://www.bundesliga.com/rss/en/rss-news.rss https://www.bundesliga.com/rss/de/rss-news.rss \
                   https://www.lequipe.fr/rss/actu_rss_Football.xml https://www.lequipe.fr/rss/actu_rss_Ligue-des-champions.xml https://rmcsport.bfmtv.com/rss/football/ https://www.sportschau.de/fussball/index~rss2.xml; do
            echo "=== $u"
            curl -sSL -m 20 -A "Mozilla/5.0 fcjj-app" -o f.xml -w "%{http_code} %{content_type} %{size_download}\n" "$u" || true
            grep -o "<title>[^<]*</title>\|<title><!\[CDATA\[[^]]*" f.xml | head -4
          done
