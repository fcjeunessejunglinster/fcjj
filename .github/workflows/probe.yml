name: probe
on: { push: { paths: [".github/workflows/probe.yml"] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          W=https://fcjj1.gilles-emeringer.workers.dev
          curl -sS -m 30 "$W/buvette?ids=20261129-1600s,20261127-2000r,20261128-1800e" -o buvette.json
          curl -sS -m 30 -o statistik.txt -w "%{http_code}" "$W/statistik?key=falsch" > statistik.code
          curl -sS -m 30 -X POST -H "origin: https://example.com" "$W/zaehler" -o /dev/null -w "%{http_code}" > zaehler.code
          curl -sS -m 30 "$W/" -o status.txt
          curl -sS -m 30 "$W/live?kat=U13" -o live.json
      - run: |
          cd out && git init -q && git checkout -q -b probe-daten && git add . && git -c user.name=probe -c user.email=p@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-daten
