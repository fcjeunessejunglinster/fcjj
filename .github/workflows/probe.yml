name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          mkdir out && cd out
          curl -sS -H "x-apisports-key: $K" "https://v3.football.api-sports.io/players?team=157&season=2026&page=1" -o spieler1.json
          curl -sS -H "x-apisports-key: $K" "https://v3.football.api-sports.io/players?team=157&season=2026&page=2" -o spieler2.json
          cd .. && git init -q pd && cp out/* pd/ && cd pd && git add -A && git -c user.name=p -c user.email=p@p commit -qm p
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-daten
